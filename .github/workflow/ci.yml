name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck @quevy/core
        run: pnpm --filter @quevy/core exec tsc --noEmit

      - name: Typecheck @quevy/tokens
        run: pnpm --filter @quevy/tokens exec tsc --noEmit

      - name: Typecheck @quevy/state
        run: pnpm --filter @quevy/state exec tsc --noEmit

      - name: Typecheck @quevy/components
        run: pnpm --filter @quevy/components exec tsc --noEmit

      - name: Typecheck @quevy/react
        run: pnpm --filter @quevy/react exec tsc --noEmit