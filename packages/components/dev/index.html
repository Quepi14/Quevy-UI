<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Quevy UI — qv-button dev</title>
  </head>
  <body style="font-family: sans-serif; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; align-items: flex-start;">
    <script type="module" src="./main.ts"></script>

    <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
      <qv-button variant="primary">Primary</qv-button>
      <qv-button variant="secondary">Secondary</qv-button>
      <qv-button variant="outline">Outline</qv-button>
      <qv-button variant="text">Text</qv-button>
      <qv-button variant="danger">Danger</qv-button>
    </div>

    <div style="display:flex; gap:.5rem; align-items:center;">
      <qv-button size="sm">Small</qv-button>
      <qv-button size="md">Medium</qv-button>
      <qv-button size="lg">Large</qv-button>
    </div>

    <div style="display:flex; gap:.5rem;">
      <qv-button disabled>Disabled</qv-button>
      <qv-button loading>Loading</qv-button>
    </div>

    <form id="test-form" style="display:flex; gap:.5rem;">
      <qv-button type="submit" variant="primary">Submit form</qv-button>
      <qv-button type="reset" variant="outline">Reset form</qv-button>
    </form>
  </body>
</html>
